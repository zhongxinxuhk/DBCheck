# 规则引擎取数层（自动生成，请勿手工编辑）
#
# 作用：本文件中的查询由 rule_engine.fill_missing_metrics 在巡检采集后执行，
# 仅补齐模板未提供的 context 键——模板已提供的键不会重复采集。
# 生成：scripts/gen_rule_metrics.py
db_type: oracle
metrics:
- key: archive_errors
  shape: scalar
  sql: SELECT COUNT(*) FROM V$ARCHIVE_DEST WHERE STATUS NOT IN ('VALID', 'INACTIVE')
- key: archive_gap
  shape: rows
  sql: SELECT thread#, low_sequence#, high_sequence# FROM v$archive_gap;
  note: 复用模板 oracle 的同名查询
- key: db_disk_await_ms
  shape: scalar
  sql: SELECT ROUND((SUM(readtim) + SUM(writetim)) * 10 / NULLIF(SUM(phyrds) + SUM(phywrts), 0), 2) FROM V$FILESTAT
  note: 平均单次物理 IO 等待(ms) = (读耗时+写耗时)/(读次数+写次数)；V$FILESTAT 为累计值，反映开库以来的整体 await 水平
- key: invalid_objects_count
  shape: scalar
  sql: SELECT COUNT(*) FROM DBA_OBJECTS WHERE STATUS <> 'VALID'
- key: library_cache_hit_ratio
  shape: scalar
  sql: SELECT ROUND(GETHITRATIO * 100, 2) FROM V$LIBRARYCACHE WHERE NAMESPACE = 'SQL AREA'
- key: pga_cache_hit_pct
  shape: scalar
  sql: SELECT ROUND(VALUE, 2) FROM V$PGASTAT WHERE NAME = 'cache hit percentage'
  note: PGA 缓存命中率(%)，§4.6 建议 >= 90；低于 90 说明 work_area 不足
- key: pga_total
  shape: scalar
  sql: SELECT VALUE FROM V$PGASTAT WHERE NAME = 'total PGA allocated'
- key: privileged_users
  shape: rows
  sql: SELECT grantee, granted_role, admin_option FROM dba_role_privs WHERE granted_role = 'DBA' ORDER BY grantee;
  note: 复用模板 oracle 的同名查询
- key: sga_total
  shape: scalar
  sql: SELECT SUM(VALUE) FROM V$SGA
- key: sysaux_usage_percent
  shape: scalar
  sql: SELECT NVL(MAX(USED_PERCENT), 0) FROM DBA_TABLESPACE_USAGE_METRICS WHERE TABLESPACE_NAME = 'SYSAUX'
- key: temp_tablespace_usage
  shape: scalar
  sql: SELECT NVL(MAX(USED_PERCENT), 0) FROM DBA_TABLESPACE_USAGE_METRICS WHERE TABLESPACE_NAME IN (SELECT TABLESPACE_NAME
    FROM DBA_TABLESPACES WHERE CONTENTS = 'TEMPORARY')
- key: undo_retention
  shape: scalar
  sql: SELECT VALUE FROM V$PARAMETER WHERE NAME = 'undo_retention'
