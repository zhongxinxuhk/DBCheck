db_type: dm
metrics:
- key: active_connections
  shape: scalar
  sql: SELECT COUNT(*) FROM V$SESSIONS
- key: archive_mode
  shape: scalar
  sql: SELECT ARCH_MODE FROM V$DATABASE
- key: buffer_pool_size
  shape: scalar
  sql: SELECT PARA_VALUE * 1024 * 1024 FROM V$DM_INI WHERE PARA_NAME = 'BUFFER'
  note: DM BUFFER 参数单位为 MB，换算为字节
- key: db_disk_await_ms
  shape: scalar
  sql: SELECT CAST(NULL AS DECIMAL(18,2)) AS await_ms FROM DUAL
  note: 当前 DM8 SQL 目录不提供已验证的平均 IO 延迟，需目标主机 iostat 采集；缺失时不触发阈值判断
- key: main_tablespace_usage
  shape: scalar
  sql: SELECT NVL(MAX(ROUND((D.TOTAL_MB - NVL(F.FREE_MB, 0)) / NULLIF(D.TOTAL_MB, 0) * 100, 2)), 0) FROM (SELECT
    TABLESPACE_NAME, ROUND(SUM(BYTES)/1048576, 2) AS TOTAL_MB FROM DBA_DATA_FILES GROUP BY TABLESPACE_NAME) D LEFT
    JOIN (SELECT TABLESPACE_NAME, ROUND(SUM(BYTES)/1048576, 2) AS FREE_MB FROM DBA_FREE_SPACE GROUP BY TABLESPACE_NAME)
    F ON D.TABLESPACE_NAME = F.TABLESPACE_NAME WHERE D.TABLESPACE_NAME NOT IN (SELECT NAME FROM V$TABLESPACE WHERE
    TYPE$ = 2)
- key: max_connections
  shape: rows
  sql: SELECT PARA_VALUE AS "Value" FROM V$DM_INI WHERE PARA_NAME = 'MAX_SESSIONS'
- key: password_policy
  shape: scalar
  sql: SELECT PARA_VALUE FROM V$DM_INI WHERE PARA_NAME = 'PWD_POLICY'
- key: temp_tablespace_usage
  shape: scalar
  sql: SELECT NVL(MAX(ROUND((D.TOTAL_MB - NVL(F.FREE_MB, 0)) / NULLIF(D.TOTAL_MB, 0) * 100, 2)), 0) FROM (SELECT
    TABLESPACE_NAME, ROUND(SUM(BYTES)/1048576, 2) AS TOTAL_MB FROM DBA_DATA_FILES GROUP BY TABLESPACE_NAME) D LEFT
    JOIN (SELECT TABLESPACE_NAME, ROUND(SUM(BYTES)/1048576, 2) AS FREE_MB FROM DBA_FREE_SPACE GROUP BY TABLESPACE_NAME)
    F ON D.TABLESPACE_NAME = F.TABLESPACE_NAME WHERE D.TABLESPACE_NAME IN (SELECT NAME FROM V$TABLESPACE WHERE TYPE$
    = 2)
