# 规则引擎取数层（自动生成，请勿手工编辑）
#
# 作用：本文件中的查询由 rule_engine.fill_missing_metrics 在巡检采集后执行，
# 仅补齐模板未提供的 context 键——模板已提供的键不会重复采集。
# 生成：scripts/gen_rule_metrics.py
db_type: tidb
metrics:
- key: active_connections
  shape: scalar
  sql: SELECT COUNT(*) FROM information_schema.processlist
- key: copr_cpu_usage
  shape: scalar
  sql: SELECT 0
  note: 需 Coprocessor 统计视图，失败自动跳过
- key: max_connections
  shape: scalar
  sql: SELECT @@max_connections
- key: slow_query_count
  shape: scalar
  sql: SELECT COUNT(*) FROM information_schema.slow_query
  note: 依赖 SLOW_QUERY 视图与日志开启，失败自动跳过
- key: tidb_auto_analyze
  shape: scalar
  sql: SELECT VARIABLE_VALUE FROM mysql.global_variables WHERE VARIABLE_NAME = 'tidb_auto_analyze'
- key: tidb_enable_binlog
  shape: scalar
  sql: SELECT VARIABLE_VALUE FROM mysql.global_variables WHERE VARIABLE_NAME = 'tidb_enable_binlog'
- key: tikv_storage_usage
  shape: scalar
  sql: SELECT MAX(used_size / NULLIF(capacity, 0)) * 100 FROM information_schema.cluster_store
  note: CLUSTER_STORE 视图随版本变化，失败自动跳过
- key: unhealthy_region_count
  shape: scalar
  sql: SELECT COUNT(*) FROM information_schema.cluster_config WHERE TYPE = 'pd'
  note: 需 PD 指标视图，失败自动跳过
