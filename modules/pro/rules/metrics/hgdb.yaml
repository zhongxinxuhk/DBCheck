db_type: hgdb
metrics:
- key: hgdb_archive_mode
  shape: rows
  sql: SHOW archive_mode
  note: 复用模板 hgdb 的同名查询
- key: hgdb_auth_settings
  shape: rows
  sql: SHOW password_encryption
  note: 复用模板 hgdb 的同名查询
- key: hgdb_connections
  shape: rows
  sql: SELECT pid, usename, application_name, client_addr, state, query FROM pg_stat_activity
  note: 复用模板 hgdb 的同名查询
- key: hgdb_roles
  shape: rows
  sql: SELECT rolname, rolcanlogin, rolsuper, rolcreaterole, rolcreatedb, rolreplication FROM pg_roles ORDER BY
    rolname
  note: 复用模板 hgdb 的同名查询
- key: hgdb_settings
  shape: rows
  sql: SELECT name, setting, unit, category, short_desc, context, source FROM pg_settings ORDER BY category, name
  note: 复用模板 hgdb 的同名查询
- key: hgdb_shared_buffers
  shape: rows
  sql: SHOW shared_buffers
  note: 复用模板 hgdb 的同名查询
- key: hgdb_tables
  shape: rows
  sql: SELECT schemaname, relname, n_live_tup, n_dead_tup, last_vacuum, last_autovacuum, last_analyze, last_autoanalyze
    FROM pg_stat_user_tables
