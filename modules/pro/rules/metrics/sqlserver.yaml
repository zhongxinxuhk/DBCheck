db_type: sqlserver
metrics:
- key: active_connections
  shape: scalar
  sql: SELECT COUNT(*) FROM sys.dm_exec_sessions WHERE is_user_process = 1
- key: auto_close
  shape: scalar
  sql: SELECT CASE WHEN SUM(CAST(is_auto_close_on AS INT)) > 0 THEN 'ON' ELSE 'OFF' END FROM sys.databases
- key: avg_fragmentation_percent
  shape: scalar
  sql: SELECT ISNULL(MAX(avg_fragmentation_in_percent), 0) FROM sys.dm_db_index_physical_stats(DB_ID(), NULL, NULL,
    NULL, 'SAMPLED')
  note: 仅当前库；全实例需逐库执行
- key: backup_success_pct
  shape: scalar
  sql: SELECT ISNULL(CAST(100.0 * (SELECT COUNT(DISTINCT bs.database_name) FROM msdb.dbo.backupset bs WHERE bs.type
    = 'D' AND bs.backup_finish_date > DATEADD(DAY, -7, GETDATE())) / NULLIF((SELECT COUNT(*) FROM sys.databases
    WHERE database_id > 4 AND state_desc = 'ONLINE'), 0) AS DECIMAL(5,2)), 100)
  note: 近 7 天有完整备份的在线用户库占比(%)。单条 SQL 无法验证备份文件可恢复性，此处只能反映「备份是否发生」；restore verifyonly 需另做
- key: days_since_checkdb
  shape: scalar
  sql: SELECT DATEDIFF(DAY, CONVERT(DATETIME, DATABASEPROPERTYEX(DB_NAME(), 'LastGoodCheckDbTime')), GETDATE())
  note: 只认数据库 CHECKDB 成功时间；旧版/不可见返回 NULL，完整备份不构成一致性校验通过
- key: log_file_growth_count
  shape: scalar
  sql: SELECT ISNULL(SUM(cntr_value), 0) FROM sys.dm_os_performance_counters WHERE counter_name = 'Log Growths'
- key: max_worker_count
  shape: scalar
  sql: SELECT max_workers_count FROM sys.dm_os_sys_info
- key: mssql_lazy_writes_per_s
  shape: scalar
  sql: SELECT ISNULL((SELECT TOP 1 cntr_value FROM sys.dm_os_performance_counters WHERE counter_name = 'Lazy writes/sec'
    AND object_name LIKE '%Buffer Manager%'), 0)
  note: Lazy writes/sec 的 DMV 累计值。注意：DMV 里 cntr_value 是累计计数，不是实时速率；要得到「每秒」须两次采样求差。此处取累计值做「是否存在持续刷脏压力」的粗判，与阈值的 per_s
    口径不完全等价，阈值本身宜按实例规模调整
- key: mssql_ple_s
  shape: scalar
  sql: SELECT ISNULL((SELECT TOP 1 cntr_value FROM sys.dm_os_performance_counters WHERE counter_name = 'Page life
    expectancy' AND object_name LIKE '%Buffer Manager%'), 0)
  note: Page Life Expectancy（秒），§4.6 建议 >= 300；低于 300 说明缓冲池被频繁刷出，通常是内存不足或存在大表全扫
