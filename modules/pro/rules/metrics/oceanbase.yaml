# 规则引擎取数层（自动生成，请勿手工编辑）
#
# 作用：本文件中的查询由 rule_engine.fill_missing_metrics 在巡检采集后执行，
# 仅补齐模板未提供的 context 键——模板已提供的键不会重复采集。
# 生成：scripts/gen_rule_metrics.py
db_type: oceanbase
metrics:
- key: innodb_buffer_pool_size
  shape: rows
  sql: SHOW VARIABLES LIKE 'innodb_buffer_pool_size';
  note: 复用模板 oceanbase 的同名查询
- key: log_bin
  shape: rows
  sql: SHOW VARIABLES LIKE 'log_bin';
  note: 复用模板 oceanbase 的同名查询
- key: max_connections
  shape: rows
  sql: SHOW VARIABLES LIKE 'max_connections';
  note: 复用模板 oceanbase 的同名查询
- key: max_used_connections
  shape: rows
  sql: SHOW GLOBAL STATUS LIKE 'Max_used_connections';
  note: 复用模板 mysql 的同名查询
- key: ob_log_disk
  shape: rows
  sql: SELECT TENANT_ID, USED_PCT AS USED_PCT FROM SYS.ALL_VIRTUAL_TENANT_DISK_STAT
  note: 兼容视囗径，随版本可能不同，失败自动跳过
- key: ob_log_disk_limit
  shape: rows
  sql: SELECT VALUE AS value FROM SYS.ALL_VIRTUAL_TENANT_PARAMETER_STAT t WHERE NAME = 'log_disk_size'
- key: ob_log_disk_recycle
  shape: rows
  sql: SELECT VALUE AS value FROM SYS.ALL_VIRTUAL_TENANT_PARAMETER_STAT t WHERE NAME = 'log_disk_percentage'
- key: ob_merge_params
  shape: rows
  sql: SHOW GLOBAL VARIABLES LIKE 'merge_%'
- key: ob_replica_info
  shape: rows
  sql: SELECT TABLE_ID, REPLICA_TYPE, ZONE FROM SYS.ALL_VIRTUAL_TABLE t LIMIT 50
- key: ob_tenant_info
  shape: rows
  sql: SELECT TENANT_ID, TENANT_NAME, LOCALITY, PRIMARY_ZONE FROM SYS.DBA_OB_TENANTS
- key: ob_unit_info
  shape: rows
  sql: SELECT UNIT_ID, TENANT_ID, ZONE, MAX_CPU, MIN_CPU FROM SYS.DBA_OB_UNITS
- key: slow_query_log
  shape: rows
  sql: SHOW VARIABLES LIKE 'slow_query_log';
  note: 复用模板 oceanbase 的同名查询
- key: sql_mode
  shape: rows
  sql: SHOW GLOBAL VARIABLES LIKE 'sql_mode'
