# -*- coding: utf-8 -*-
# GBase 8a MPP Cluster 规则取数层（手写，非脚本生成）
#
# 作用：本文件中的查询由 rule_engine.fill_missing_metrics 在巡检采集后执行，
# 仅补齐模板未提供的 context 键——模板已提供的键不会重复采集。
#
# 取舍说明：
# * 只用 GBase 8a 明确兼容的 MySQL 语法与 information_schema 视图；
#   集群层状态（gcadmin showcluster / showdistribution / 节点存活 / 分片一致性）
#   无法由单条 SQL 表达，故不在此虚构，交由巡检模板的命令行采集项与人工判据。
# * 任一查询在目标版本不可用时不报错，仅该项跳过（对应规则不触发）。
db_type: gbase8a
metrics:
- key: gbase8a_conn_used
  shape: scalar
  sql: SELECT COUNT(*) FROM information_schema.PROCESSLIST
  note: 集群视角的当前会话总数（gcluster 节点汇总）
- key: gbase8a_max_conn
  shape: scalar
  sql: SELECT @@max_connections
  note: 用 @@ 系统变量取值，避免依赖 GLOBAL_VARIABLES 视图在部分版本的差异
- key: gbase8a_long_sessions
  shape: scalar
  sql: SELECT COUNT(*) FROM information_schema.PROCESSLIST WHERE COMMAND <> 'Sleep' AND TIME > 600
- key: gbase8a_idle_sessions
  shape: scalar
  sql: SELECT COUNT(*) FROM information_schema.PROCESSLIST WHERE COMMAND = 'Sleep' AND TIME > 3600
- key: gbase8a_no_pk_tables
  shape: scalar
  sql: SELECT COUNT(*) FROM information_schema.TABLES T WHERE T.TABLE_TYPE = 'BASE TABLE' AND T.TABLE_SCHEMA
    NOT IN ('information_schema', 'gbase', 'gclusterdb', 'performance_schema') AND NOT EXISTS (SELECT
    1 FROM information_schema.STATISTICS S WHERE S.TABLE_SCHEMA = T.TABLE_SCHEMA AND S.TABLE_NAME = T.TABLE_NAME
    AND S.INDEX_NAME = 'PRIMARY')
- key: gbase8a_non_utf8_schemas
  shape: scalar
  sql: SELECT COUNT(*) FROM information_schema.SCHEMATA WHERE SCHEMA_NAME NOT IN ('information_schema',
    'gbase', 'gclusterdb', 'performance_schema') AND DEFAULT_CHARACTER_SET_NAME NOT IN ('utf8', 'utf8mb4')
- key: gbase8a_max_table_mb
  shape: scalar
  sql: SELECT IFNULL(ROUND(MAX(DATA_LENGTH)/1024/1024, 2), 0) FROM information_schema.TABLES WHERE TABLE_SCHEMA
    NOT IN ('information_schema', 'gbase', 'gclusterdb', 'performance_schema')
- key: gbase8a_total_data_mb
  shape: scalar
  sql: SELECT IFNULL(ROUND(SUM(DATA_LENGTH)/1024/1024, 2), 0) FROM information_schema.TABLES WHERE TABLE_SCHEMA
    NOT IN ('information_schema', 'gbase', 'gclusterdb', 'performance_schema')
- key: gbase8a_table_count
  shape: scalar
  sql: SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_TYPE = 'BASE TABLE' AND TABLE_SCHEMA
    NOT IN ('information_schema', 'gbase', 'gclusterdb', 'performance_schema')
- key: gbase8a_schema_count
  shape: scalar
  sql: SELECT COUNT(*) FROM information_schema.SCHEMATA WHERE SCHEMA_NAME NOT IN ('information_schema',
    'gbase', 'gclusterdb', 'performance_schema')

- key: gbase8a_data_nodes
  shape: rows
  sql: SHOW NODES
- key: gbase8a_coordinators
  shape: rows
  sql: SHOW GCLUSTER NODES
- key: gbase8a_cluster_components
  shape: rows
  sql: SELECT * FROM information_schema.CLUSTER_MONIT_INFO
