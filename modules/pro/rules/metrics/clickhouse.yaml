# 规则引擎取数层（自动生成，请勿手工编辑）
#
# 作用：本文件中的查询由 rule_engine.fill_missing_metrics 在巡检采集后执行，
# 仅补齐模板未提供的 context 键——模板已提供的键不会重复采集。
# 生成：scripts/gen_rule_metrics.py
db_type: clickhouse
metrics:
- key: clickhouse_disks_max_used_pct
  shape: scalar
  sql: SELECT MAX(round((total_space - free_space) / total_space * 100, 2)) FROM system.disks WHERE total_space
    > 0
- key: clickhouse_exception_count
  shape: scalar
  sql: SELECT COUNT() FROM system.query_log WHERE exception != '' AND event_date >= today() - 1
- key: clickhouse_future_parts_total
  shape: scalar
  sql: SELECT SUM(future_parts) FROM system.replicas
- key: clickhouse_merges_active_count
  shape: scalar
  sql: SELECT COUNT() FROM system.merges
- key: clickhouse_mutations_stuck_count
  shape: scalar
  sql: SELECT COUNT() FROM system.mutations WHERE NOT is_done
- key: clickhouse_parts_max_count
  shape: scalar
  sql: SELECT MAX(parts_count) FROM system.replicas
- key: clickhouse_replicas_max_delay
  shape: scalar
  sql: SELECT MAX(absolute_delay) FROM system.replicas
- key: clickhouse_replicas_readonly_count
  shape: scalar
  sql: SELECT COUNT() FROM system.replicas WHERE is_readonly
- key: clickhouse_settings_map
  shape: map
  sql: SELECT name, value FROM system.settings
  map_case: asis
- key: clickhouse_slow_query_count
  shape: scalar
  sql: SELECT COUNT() FROM system.query_log WHERE type = 'QueryFinish' AND query_duration_ms > 1000 AND event_date
    >= today() - 1
