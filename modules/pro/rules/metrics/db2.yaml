# 规则引擎取数层（自动生成，请勿手工编辑）
#
# 作用：本文件中的查询由 rule_engine.fill_missing_metrics 在巡检采集后执行，
# 仅补齐模板未提供的 context 键——模板已提供的键不会重复采集。
# 生成：scripts/gen_rule_metrics.py
db_type: db2
metrics:
- key: db2_applications_count
  shape: scalar
  sql: SELECT COUNT(*) FROM SYSIBMADM.APPLICATIONS
- key: db2_dbcfg_map
  shape: map
  sql: SELECT name, value FROM SYSIBMADM.DBCFG
  map_case: upper
- key: db2_dbmcfg_map
  shape: map
  sql: SELECT name, value FROM SYSIBMADM.DBMCFG
  map_case: upper
- key: db2_lockwait_count
  shape: scalar
  sql: SELECT COUNT(*) FROM SYSIBMADM.SNAPLOCKWAIT
- key: db2_pkg_cache_count
  shape: scalar
  sql: SELECT INTEGER(PKG_CACHE_NUM_ENTRIES) FROM SYSIBMADM.MON_PKG_CACHE_SUMMARY
  note: MON_PKG_CACHE_SUMMARY 视图名随版本可能不同，失败自动跳过
- key: db2_pkg_cache_max_time
  shape: scalar
  sql: SELECT INTEGER(PKG_CACHE_TOP_EXEC_TIME) FROM SYSIBMADM.MON_PKG_CACHE_SUMMARY
  note: 同上
- key: db2_stale_stats_count
  shape: scalar
  sql: SELECT COUNT(*) FROM SYSCAT.TABLES WHERE STATS_TIME IS NULL OR STATS_TIME < CURRENT TIMESTAMP - 30 DAYS
- key: db2_tablespace_max_used
  shape: scalar
  sql: SELECT MAX(DECIMAL(FLOAT(TOTAL_USED_PAGES) / NULLIF(TOTAL_USABLE_PAGES, 0)) * 100) FROM SYSIBMADM.TBSP_UTILIZATION
- key: db2_unused_index_count
  shape: scalar
  sql: SELECT COUNT(*) FROM SYSCAT.INDEXES WHERE LASTUSED < CURRENT DATE - 30 DAYS
  note: LASTUSED 需 9.7+
- key: db2_version_number
  shape: scalar
  sql: SELECT SERVICE_LEVEL FROM SYSIBMADM.ENV_INST_INFO
