name: Sync upstream functionality

on:
  schedule:
    # 03:23 Asia/Shanghai, daily.
    - cron: '23 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dbpulse-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'zhongxinxuhk/DBCheck'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match the Docker runtime. Existing maintenance scripts use 3.12 f-strings.
          python-version: '3.12'

      - name: Fetch upstream without importing tags
        run: git fetch --no-tags https://github.com/fiyo/DBCheck.git main:refs/remotes/upstream/main

      - name: Verify sync protections
        run: python scripts/verify_upstream_sync.py

      - name: Merge functionality and record deferred changes
        run: python scripts/sync_upstream.py --apply

      # GITHUB_TOKEN pushes do not trigger the ordinary push workflows.
      # Run the required checks here before publishing the resulting commit.
      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements-validation.txt

      - name: Validate candidate
        run: |
          python scripts/check_license_headers.py
          python scripts/verify_dbpulse.py
          python scripts/verify_service_management.py
          python scripts/verify_operations.py
          python scripts/verify_scheduled_inspection.py
          python scripts/verify_clusters.py
          python scripts/verify_database_compatibility.py
          python scripts/verify_portable_bundle.py
          python -m pytest -q modules/inspection/tests modules/core/tests modules/objstore/tests
          python -m compileall -q modules plugins scripts i18n web_ui.py
          git diff --check

      - name: Commit and push validated changes
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No upstream functionality changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Explicit path list. Includes allowed new files, excludes runtime data.
          python - <<'PY'
          import json
          import subprocess
          from scripts.sync_upstream import STATE_PATH, eligible
          names = subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().split('\0')
          names += subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z']).decode().split('\0')
          names = sorted(set(names) - {''})
          assert all(path == STATE_PATH or eligible(path) for path in names), names
          subprocess.run(['git', 'add', '--', *names], check=True)
          PY
          git commit -m 'chore: sync upstream functionality preserving DBPulse customizations'
          # A concurrent user push or protected branch rejects this push safely.
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
