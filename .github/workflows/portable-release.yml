name: Build and verify portable packages
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version used for a build-only verification run
        required: true
        default: v1.0.1
permissions:
  contents: read
jobs:
  native:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: windows-x86_64, runner: windows-latest, python_arch: x64, collect: DBPulse-Windows}
          - {platform: macos-arm64, runner: macos-15, python_arch: arm64, collect: DBPulse-macOS}
          - {platform: linux-x86_64, runner: ubuntu-24.04, python_arch: x64, collect: DBPulse-Linux, image: quay.io/pypa/manylinux_2_28_x86_64}
          - {platform: linux-arm64, runner: ubuntu-24.04-arm, python_arch: arm64, collect: DBPulse-Linux, image: quay.io/pypa/manylinux_2_28_aarch64}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Stamp the release version
        shell: bash
        run: python build/release_pipeline.py stamp --version "$RELEASE_VERSION"
      - name: Prepare verified drivers and bundled Java
        shell: bash
        run: |
          python build/portable_release.py drivers --cache .portable-build/downloads
          python build/portable_bundle.py runtime --platform '${{ matrix.platform }}' --cache .portable-build/downloads
      - name: Build Windows or macOS binary
        if: ${{ !startsWith(matrix.platform, 'linux-') }}
        shell: bash
        run: python build/portable_release.py native --platform '${{ matrix.platform }}'
      - name: Build Linux against glibc 2.28 on its native CPU
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          python build/portable_release.py python --platform '${{ matrix.platform }}'
          docker run --rm -e DBPULSE_PORTABLE_BUILD=1 -v "$PWD:/src" -w /src '${{ matrix.image }}' \
            '.portable-build/native-python/${{ matrix.platform }}/python/bin/python3.12' \
            build/portable_release.py native --platform '${{ matrix.platform }}'
      - name: Stage the portable directory
        shell: bash
        run: |
          JAVA_ARCHIVE=$(python -c "import json;print(json.load(open('.portable-build/downloads/${{ matrix.platform }}-java.json'))['archive'])")
          python build/portable_bundle.py stage --output .portable-build/staged/DBPulse-Portable \
            --required-platforms '${{ matrix.platform }}' --platform '${{ matrix.platform }}' \
            --component '.portable-build/native/${{ matrix.platform }}/${{ matrix.collect }}' \
            --runtime "$JAVA_ARCHIVE" --receipt '.portable-build/downloads/${{ matrix.platform }}-java.json'
          cp '.portable-build/downloads/${{ matrix.platform }}-java.json' '.portable-build/staged/DBPulse-Portable/runtime/${{ matrix.platform }}/receipt.json'
      - name: Verify Windows or macOS runtime and application
        if: ${{ !startsWith(matrix.platform, 'linux-') }}
        shell: bash
        run: python build/release_pipeline.py check-component --bundle .portable-build/staged/DBPulse-Portable --platform '${{ matrix.platform }}' --output '.portable-build/staged/DBPulse-Portable/verification/${{ matrix.platform }}.json'
      - name: Verify Linux runtime on Debian 11
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          docker run --rm -e GITHUB_SHA -v "$PWD:/src" -w /src debian:11-slim \
            /src/.portable-build/native-python/${{ matrix.platform }}/python/bin/python3.12 \
            build/release_pipeline.py check-component --bundle .portable-build/staged/DBPulse-Portable --platform '${{ matrix.platform }}' --output '.portable-build/staged/DBPulse-Portable/verification/${{ matrix.platform }}.json'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: portable-component-${{ matrix.platform }}
          path: |
            .portable-build/staged/DBPulse-Portable/bin/${{ matrix.platform }}
            .portable-build/staged/DBPulse-Portable/runtime/${{ matrix.platform }}
            .portable-build/staged/DBPulse-Portable/verification/${{ matrix.platform }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
  assemble:
    name: Assemble release candidates
    needs: native
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: portable-component-*
          merge-multiple: true
          path: .portable-build/components
      - run: python build/portable_release.py drivers --cache .portable-build/downloads
      - run: python build/release_pipeline.py assemble --components .portable-build/components --output release-assets --version "$RELEASE_VERSION" --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-candidate-${{ inputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3
  windows-state:
    name: Create configuration using Windows executable
    needs: assemble
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-candidate-${{ inputs.version }}
          path: release-assets
      - name: Save encrypted datasource, key file and changed account password
        shell: bash
        run: python build/release_pipeline.py transfer-seed --archive "release-assets/DBPulse-$RELEASE_VERSION-Windows-Linux-Portable.zip" --output windows-transfer-fixture.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-transfer-fixture
          path: windows-transfer-fixture.zip
          if-no-files-found: error
          retention-days: 1
  verify-transfer:
    name: Verify copied Windows state on ${{ matrix.platform }}
    needs: [assemble, windows-state]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: windows-x86_64, runner: windows-latest, archive: Windows-Linux-Portable}
          - {platform: linux-x86_64, runner: ubuntu-24.04, archive: Windows-Linux-Portable}
          - {platform: linux-arm64, runner: ubuntu-24.04-arm, archive: Windows-Linux-Portable}
          - {platform: macos-arm64, runner: macos-15, archive: macos-arm64}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-candidate-${{ inputs.version }}
          path: release-assets
      - uses: actions/download-artifact@v8.0.2
        with:
          name: windows-transfer-fixture
          path: transfer-fixture
      - name: Verify credentials and user password without reconfiguration
        shell: bash
        run: python build/release_pipeline.py transfer-verify --archive "release-assets/DBPulse-$RELEASE_VERSION-${{ matrix.archive }}.zip" --fixture transfer-fixture/windows-transfer-fixture.zip --platform '${{ matrix.platform }}' --output 'verification/${{ matrix.platform }}.json'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: transfer-verification-${{ matrix.platform }}
          path: verification/*.json
          if-no-files-found: error
          retention-days: 7
