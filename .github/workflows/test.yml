name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-validation.txt

      - name: Run test suite
        run: |
          python scripts/verify_dbpulse.py
          python scripts/verify_upstream_sync.py
          python scripts/verify_service_management.py
          if [ -d tests ] && ls tests/test_*.py >/dev/null 2>&1; then
            pytest -q
          else
            echo "tests/ not present in repo (local-only); skipping pytest."
          fi
