name: Tests

on:
  workflow_call:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-validation.txt

      - name: Run test suite
        run: |
          python -m compileall -q modules plugins scripts i18n web_ui.py
          git diff --check
          python scripts/check_license_headers.py
          python scripts/verify_dbpulse.py
          python scripts/verify_upstream_sync.py
          python scripts/verify_service_management.py
          python scripts/verify_operations.py
          python scripts/verify_operations_round1.py
          python scripts/verify_operations_groups.py
          python scripts/verify_scheduled_inspection.py
          python scripts/verify_clusters.py
          python scripts/verify_database_compatibility.py
          python scripts/verify_portable_bundle.py
          python -m pytest -q modules/inspection/tests modules/core/tests modules/objstore/tests modules/desktop/tests
          if [ -d tests ] && ls tests/test_*.py >/dev/null 2>&1; then
            pytest -q
          else
            echo "tests/ not present in repo (local-only); skipping pytest."
          fi
