name: Check, build and publish DBPulse
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dbpulse-production-release
  cancel-in-progress: false
jobs:
  checks:
    name: Required validation
    uses: ./.github/workflows/test.yml
  version:
    name: Allocate release version
    needs: checks
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      published: ${{ steps.plan.outputs.published }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build/release_pipeline.py plan
  packages:
    name: Native packages and migration checks
    needs: [checks, version]
    if: needs.version.outputs.published != 'true'
    uses: ./.github/workflows/portable-release.yml
    with:
      version: ${{ needs.version.outputs.tag }}
  publish:
    name: Publish verified release
    needs: [checks, version, packages]
    if: needs.version.outputs.published != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-candidate-${{ needs.version.outputs.tag }}
          path: release-assets
      - name: Verify every asset and publish after complete uploads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.version.outputs.tag }}
        run: python build/release_pipeline.py publish --directory release-assets --version "$RELEASE_VERSION" --sha "$GITHUB_SHA"
