name: Check, build and publish DBPulse
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dbpulse-production-release
  cancel-in-progress: false
jobs:
  checks:
    name: Required validation
    uses: ./.github/workflows/test.yml
  cleanup:
    name: Reclaim published temporary artifacts
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Remove temporary artifacts backed by published release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build/release_pipeline.py cleanup-artifacts --apply
  version:
    name: Allocate release version
    needs: checks
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      published: ${{ steps.plan.outputs.published }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build/release_pipeline.py plan
  packages:
    name: Native packages and migration checks
    needs: [checks, version, cleanup]
    if: needs.version.outputs.published != 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/portable-release.yml
    with:
      version: ${{ needs.version.outputs.tag }}
  publish:
    name: Publish verified release
    needs: [checks, version, packages]
    if: needs.version.outputs.published != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Restore verified release candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build/release_pipeline.py stage-download --name release-candidate --output release-assets
      - name: Verify every asset and publish after complete uploads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.version.outputs.tag }}
        run: python build/release_pipeline.py publish --directory release-assets --version "$RELEASE_VERSION" --sha "$GITHUB_SHA"
      - name: Show published iteration details
        run: cat release-assets/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary private release transport
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.version.outputs.tag }}
        run: python build/release_pipeline.py stage-cleanup --version "$RELEASE_VERSION" --sha "$GITHUB_SHA"
      - name: Reclaim published run artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build/release_pipeline.py cleanup-artifacts --apply --current-run "$GITHUB_RUN_ID"
