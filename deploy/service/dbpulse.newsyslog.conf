# DBPulse（macOS launchd）日志轮转配置
#
# 用途：launchd 的 StandardOutPath / StandardErrorPath 由 launchd 自己持 fd 打开，
#       Python 侧无法安全轮转，交由 newsyslog 按大小裁剪，保证总占用有上限。
#
# 安装：
#   sudo cp deploy/service/dbpulse.newsyslog.conf /etc/newsyslog.d/dbpulse.conf
#   # 若安装目录不是 /opt/dbpulse，请同步替换下面的路径
#   sudo newsyslog -v            # 干跑检查配置是否被正确解析
#
# 字段：日志路径  属主:属组  权限  保留份数  大小(KB)  时间  标志
# 标志：N = 不发信号；Z = 轮转后 gzip 压缩；C = 文件不存在时创建
#
# 注意：launchd 不会因文件被改名而重新打开日志，进程会继续写已改名的旧文件；
#       因此「当前」输出可能落在 wheel 文件里，直到 launchd 重启任务。
#       这是 macOS 上无法在进程内解决的限制，容量上限仍然成立（份数 × 大小）。
#
/opt/dbpulse/data/logs/launchd.out.log    root:wheel  644  5  10240  *  NZ
/opt/dbpulse/data/logs/launchd.err.log    root:wheel  644  5  10240  *  NZ
